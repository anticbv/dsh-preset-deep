name: validate

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies (js-yaml, pinned by package-lock.json)
        run: npm ci
      - name: Validate cordis.patch.yml and package.json
        run: node scripts/validate.cjs
      - name: Test the icon half in a fake DOM
        run: node scripts/test-icon.cjs
      - name: Check acceptance-case markers
        run: node scripts/acceptance.cjs
