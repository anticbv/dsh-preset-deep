name: validate

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install js-yaml (only dependency, used by the validator)
        run: npm install --no-save js-yaml@4.3.2
      - name: Validate cordis.patch.yml and package.json
        run: node scripts/validate.cjs
      - name: Test the icon half in a fake DOM
        run: node scripts/test-icon.cjs
